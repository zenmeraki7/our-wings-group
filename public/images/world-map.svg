<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" opacity="0.6">
  <defs>
    <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFC295" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#DFC295" stop-opacity="0.02" />
    </radialGradient>
  </defs>

  <!-- World Grid Lines -->
  <g stroke="#DFC295" stroke-opacity="0.08" stroke-width="0.75" stroke-dasharray="3,3">
    <line x1="50" y1="125" x2="950" y2="125" />
    <line x1="50" y1="250" x2="950" y2="250" />
    <line x1="50" y1="375" x2="950" y2="375" />
    <line x1="200" y1="50" x2="200" y2="450" />
    <line x1="400" y1="50" x2="400" y2="450" />
    <line x1="600" y1="50" x2="600" y2="450" />
    <line x1="800" y1="50" x2="800" y2="450" />
  </g>

  <!-- Continents Simplified High-Tech Vector Paths -->
  <g fill="#DFC295" fill-opacity="0.12" stroke="#DFC295" stroke-opacity="0.25" stroke-width="1">
    <!-- North America -->
    <path d="M 120 70 Q 180 60 260 85 Q 280 120 250 170 Q 220 220 200 240 Q 180 230 160 190 Q 110 180 90 140 Q 100 90 120 70 Z" />
    <!-- Greenland -->
    <path d="M 330 40 Q 370 45 360 80 Q 320 90 310 60 Z" />
    <!-- South America -->
    <path d="M 230 250 Q 290 270 310 320 Q 290 400 250 440 Q 230 420 230 360 Q 210 310 230 250 Z" />
    <!-- Europe -->
    <path d="M 450 80 Q 520 70 550 110 Q 530 160 480 165 Q 440 140 450 80 Z" />
    <!-- Africa -->
    <path d="M 460 175 Q 560 180 570 260 Q 540 370 490 390 Q 450 330 440 240 Q 440 200 460 175 Z" />
    <!-- Asia -->
    <path d="M 560 70 Q 750 60 840 120 Q 850 220 790 270 Q 710 270 660 210 Q 640 150 560 130 Z" />
    <!-- Indian Subcontinent Highlight -->
    <path d="M 640 180 Q 690 190 700 240 Q 665 290 645 240 Q 635 200 640 180 Z" fill="#DFC295" fill-opacity="0.25" stroke="#DFC295" stroke-width="1.5" />
    <!-- Australia -->
    <path d="M 760 310 Q 840 300 860 360 Q 820 410 760 380 Q 740 340 760 310 Z" />
  </g>

  <!-- Flight Connections / Global Routes -->
  <g stroke="#DFC295" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="4,4" fill="none">
    <!-- India to Middle East / Europe -->
    <path d="M 665 225 Q 560 180 490 135" />
    <!-- India to Southeast Asia / Singapore -->
    <path d="M 670 230 Q 730 260 750 280" />
    <!-- India to UK / North America -->
    <path d="M 665 220 Q 480 80 240 140" />
    <!-- India to Australia -->
    <path d="M 675 235 Q 730 300 790 340" />
    <!-- Europe to North America -->
    <path d="M 480 135 Q 360 90 240 140" />
  </g>

  <!-- Strategic Hub Beacon Dots -->
  <g fill="#DFC295">
    <!-- India Hub (Active Pulse) -->
    <circle cx="665" cy="225" r="4.5" fill="#F8E8D2" />
    <circle cx="665" cy="225" r="9" stroke="#DFC295" stroke-width="1" stroke-opacity="0.6" fill="none" />
    <circle cx="665" cy="225" r="14" stroke="#DFC295" stroke-width="0.75" stroke-opacity="0.3" fill="none" />
    <!-- London / Europe -->
    <circle cx="480" cy="135" r="3.5" />
    <!-- Dubai / Middle East -->
    <circle cx="585" cy="195" r="3.5" />
    <!-- Singapore -->
    <circle cx="745" cy="275" r="3.5" />
    <!-- New York -->
    <circle cx="235" cy="145" r="3.5" />
    <!-- Sydney -->
    <circle cx="830" cy="370" r="3.5" />
  </g>
</svg>
